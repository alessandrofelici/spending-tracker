# The only categories a transaction can ever be assigned.
# The LLM is constrained to this list; anything else is rejected.
categories = [
    "Groceries",
    "Dining",
    "Shopping",
    "Gas & Transport",
    "Travel",
    "Subscriptions",
    "Bills & Utilities",
    "Entertainment",
    "Health",
    "Education",
    "Fees & Interest",
    "Payments & Credits",
    "Other",
]

# What each category means. Jev reads these when choosing, so clearer
# descriptions mean better answers. Categories without one are matched by name.
[descriptions]
"Groceries" = "Supermarkets and grocery stores"
"Dining" = "Restaurants, cafes, coffee shops, bars, fast food, food delivery"
"Shopping" = "Retail stores, online shopping, clothing, electronics, general merchandise"
"Gas & Transport" = "Fuel, rideshare, parking, public transit, tolls, car maintenance"
"Travel" = "Airlines, hotels, vacation rentals, travel agencies"
"Subscriptions" = "Recurring digital services: streaming, software, apps, memberships"
"Bills & Utilities" = "Phone, internet, electricity, gas, water, insurance"
"Entertainment" = "Movies, concerts, events, games, hobbies"
"Health" = "Pharmacies, doctors, dentists, clinics, fitness"
"Education" = "Tuition, textbooks, courses, school supplies"
"Fees & Interest" = "Bank or card fees and interest charges"
"Payments & Credits" = "Payments to the card, refunds and credits"
"Other" = "Doesn't clearly fit any other category"

# Keyword rules are checked first (case-insensitive substring match on the
# transaction description). They are free, offline, and always win over the LLM.
[rules]
"Groceries" = ["KROGER", "MEIJER", "ALDI", "TRADER JOE", "WHOLE FOODS", "SPARTAN", "FOODS MARKET"]

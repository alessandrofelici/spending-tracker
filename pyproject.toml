[project]
name = "spending-tracker"
version = "0.1.0"
description = "Parse credit card statements, categorize spending, and chart it month by month."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "plotly>=5.22",
    # 1.64 keeps a component's trigger value until Python reads it; the Plaid
    # sign-in hands its result back that way.
    "streamlit>=1.64",
    "tomlkit>=0.15.1",
    # Where the Plaid access token is stored (falls back to a private file).
    "keyring>=25",
]

[project.scripts]
spend = "spending.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spending"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Show why tests were skipped (e.g. no git for the .gitignore checks).
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
# Line length is the formatter's job; it leaves long strings and SQL alone.
ignore = ["E501"]

[tool.ty.environment]
python = ".venv"
# tests/ so the tests' shared fakes (tests/fakes.py) resolve.
root = ["src", "tests"]

# Claude Code worktrees are full checkouts inside the repo; each is
# checked from its own directory, not from here.
[tool.ty.src]
exclude = [".claude/worktrees"]

[project]
name = "spending-tracker"
version = "0.1.0"
description = "Parse credit card statements, categorize spending, and chart it month by month."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "plotly>=5.22",
    "streamlit>=1.38",
]

[project.scripts]
spend = "spending.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spending"]
